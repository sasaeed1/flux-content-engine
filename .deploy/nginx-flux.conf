# /etc/nginx/sites-available/flux.remoteops.co
# Reverse proxy: flux.remoteops.co -> Next.js Flux dashboard on 127.0.0.1:3010
#
# After deploying:
#   ln -s /etc/nginx/sites-available/flux.remoteops.co /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d flux.remoteops.co   (once DNS A record is set)

server {
    listen 80;
    listen [::]:80;
    server_name flux.remoteops.co;

    # Generous body size for any media uploads from the dashboard.
    client_max_body_size 25m;

    # Proxy to the Flux web container (bound to localhost:3010).
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Long-running server actions (carousel rendering) can take a while.
    location ~ ^/(api|_next) {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Health probe convenience.
    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    access_log /var/log/nginx/flux.access.log;
    error_log  /var/log/nginx/flux.error.log;
}
